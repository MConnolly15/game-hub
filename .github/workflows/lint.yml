name: CI & Deployment

on:
  push:
  pull_request:
    types:
      - closed

permissions:
  contents: read

jobs:
  terraform-validation:
    name: Validate Terraform
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialise Terraform without backend
        run: terraform init -backend=false

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: Initialise TFLint plugins
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TFLint
        run: tflint --recursive


  java-validation:
    name: Validate Java & Run Tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Spotless
        run: ./gradlew spotlessCheck

      - name: Run Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Run tests
        run: ./gradlew test


  aws-authentication:
    name: Verify AWS Credentials
    needs:
      - terraform-validation
      - java-validation

    if: |
      github.event_name == 'push' &&
      needs.terraform-validation.result == 'success' &&
      needs.java-validation.result == 'success'

    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ vars.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-west-2

    steps:
      - name: Verify AWS identity
        run: aws sts get-caller-identity


  provision-infrastructure:
    name: Provision AWS Infrastructure
    needs:
      - terraform-validation
      - java-validation
      - aws-authentication

    if: |
      github.event_name == 'push' &&
      needs.terraform-validation.result == 'success' &&
      needs.java-validation.result == 'success' &&
      needs.aws-authentication.result == 'success'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ vars.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-west-2
      TF_VAR_branch_name: ${{ github.ref_name }}
      TF_VAR_ec2_ssh_public_key: ${{ vars.EC2_SSH_PUBLIC_KEY }}

    outputs:
      ec2_host: ${{ steps.infrastructure.outputs.ec2_host }}
      website_url: ${{ steps.infrastructure.outputs.website_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Check deployment configuration
        run: |
          if [ -z "${{ vars.TF_STATE_BUCKET }}" ]; then
            echo "TF_STATE_BUCKET has not been configured."
            exit 1
          fi

          if [ -z "${{ vars.EC2_SSH_PUBLIC_KEY }}" ]; then
            echo "EC2_SSH_PUBLIC_KEY has not been configured."
            exit 1
          fi

          echo "Deployment configuration is present."

      - name: Initialise Terraform state
        run: |
          echo "Environment branch: ${{ github.ref_name }}"

          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=game-hub/${{ github.ref_name }}/terraform.tfstate"

      - name: Import existing main database
        if: github.ref_name == 'main'
        run: |
          if terraform state show aws_db_instance.postgres > /dev/null 2>&1; then
            echo "Main RDS instance is already managed by Terraform."
          else
            echo "Importing existing main RDS instance game-hive-db..."
            terraform import aws_db_instance.postgres game-hive-db
          fi

      - name: Provision infrastructure
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            LEGACY_SUBNET="game-hive-dev-db"

            if terraform state show aws_db_instance.postgres > /dev/null 2>&1; then
              CURRENT_SUBNET="$(terraform state show aws_db_instance.postgres \
                | grep 'db_subnet_group_name' \
                | head -1 \
                | cut -d '=' -f2 \
                | tr -d ' "')"

              echo "Current RDS subnet group: $CURRENT_SUBNET"

              if [ "$CURRENT_SUBNET" = "$LEGACY_SUBNET" ]; then
                echo "Legacy branch database detected."
                echo "Recreating disposable RDS instance with branch-specific networking."

                terraform apply \
                  -auto-approve \
                  -input=false \
                  -replace=aws_db_instance.postgres

                exit 0
              fi
            fi
          fi

          echo "Running normal Terraform apply."

          terraform apply \
            -auto-approve \
            -input=false

      - name: Read infrastructure outputs
        id: infrastructure
        run: |
          EC2_HOST="$(terraform output -raw ec2_public_ip)"
          WEBSITE_URL="$(terraform output -raw website_url)"

          echo "ec2_host=$EC2_HOST" >> "$GITHUB_OUTPUT"
          echo "website_url=$WEBSITE_URL" >> "$GITHUB_OUTPUT"

          echo "EC2 IP: $EC2_HOST"
          echo "Website URL: $WEBSITE_URL"


  database-migrations:
    name: Run Database Migrations
    needs:
      - provision-infrastructure

    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ vars.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-west-2
      TF_VAR_branch_name: ${{ github.ref_name }}
      TF_VAR_ec2_ssh_public_key: ${{ vars.EC2_SSH_PUBLIC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Initialise Terraform state
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=game-hub/${{ github.ref_name }}/terraform.tfstate"

      - name: Get database password
        run: |
          DB_PASSWORD="$(terraform -chdir=terraform output -raw db_password)"

          echo "::add-mask::$DB_PASSWORD"
          echo "DB_PASSWORD=$DB_PASSWORD" >> "$GITHUB_ENV"

      - name: Run Flyway migrations
        run: |
          ./gradlew flywayMigrate \
            -Pflyway.url="jdbc:postgresql://$(terraform -chdir=terraform output -raw rds_endpoint):$(terraform -chdir=terraform output -raw rds_port)/$(terraform -chdir=terraform output -raw rds_db_name)" \
            -Pflyway.user="$(terraform -chdir=terraform output -raw rds_username)" \
            -Pflyway.password="$DB_PASSWORD"


  application-build:
    name: Build Spring Boot Application
    needs:
      - provision-infrastructure

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build executable JAR
        run: ./gradlew bootJar

      - name: Locate application JAR
        run: |
          APP_JAR="$(find build/libs \
            -maxdepth 1 \
            -name '*.jar' \
            ! -name '*-plain.jar' \
            | head -1)"

          if [ -z "$APP_JAR" ]; then
            echo "No application JAR was produced."
            exit 1
          fi

          echo "Application JAR: $APP_JAR"

          cp "$APP_JAR" build/libs/gamehub-app.jar

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamehub-application
          path: build/libs/gamehub-app.jar
          retention-days: 1


  deploy-application:
    name: Deploy Application to EC2
    needs:
      - provision-infrastructure
      - database-migrations
      - application-build

    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ vars.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-west-2
      TF_VAR_branch_name: ${{ github.ref_name }}
      TF_VAR_ec2_ssh_public_key: ${{ vars.EC2_SSH_PUBLIC_KEY }}

      EC2_HOST: ${{ needs.provision-infrastructure.outputs.ec2_host }}
      WEBSITE_URL: ${{ needs.provision-infrastructure.outputs.website_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: gamehub-application
          path: deployment

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Initialise Terraform state
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=game-hub/${{ github.ref_name }}/terraform.tfstate"

      - name: Configure SSH
        run: |
          if [ -z "${{ secrets.EC2_SSH_PRIVATE_KEY }}" ]; then
            echo "EC2_SSH_PRIVATE_KEY has not been configured."
            exit 1
          fi

          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/game-hive

          chmod 600 ~/.ssh/game-hive

      - name: Wait for EC2 SSH
        run: |
          echo "Waiting for SSH on $EC2_HOST..."

          for i in {1..30}; do
            if ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "SSH is available."
              exit 0
            fi

            echo "Waiting for EC2..."
            sleep 10
          done

          echo "SSH did not become available."
          exit 1

      - name: Wait for EC2 bootstrap
        run: |
          ssh \
            -i ~/.ssh/game-hive \
            ec2-user@"$EC2_HOST" \
            "sudo cloud-init status --wait"

      - name: Get database password
        run: |
          DB_PASSWORD="$(terraform -chdir=terraform output -raw db_password)"

          echo "::add-mask::$DB_PASSWORD"
          echo "DB_PASSWORD=$DB_PASSWORD" >> "$GITHUB_ENV"

      - name: Create application environment
        run: |
          DB_HOST="$(terraform -chdir=terraform output -raw rds_endpoint)"
          DB_PORT="$(terraform -chdir=terraform output -raw rds_port)"
          DB_NAME="$(terraform -chdir=terraform output -raw rds_db_name)"
          DB_USERNAME="$(terraform -chdir=terraform output -raw rds_username)"

          cat > /tmp/app.env <<EOF
          DB_HOST=$DB_HOST
          DB_PORT=$DB_PORT
          DB_NAME=$DB_NAME
          DB_USERNAME=$DB_USERNAME
          DB_PASSWORD=$DB_PASSWORD
          SERVER_PORT=8080
          EOF

      - name: Upload application to EC2
        run: |
          scp \
            -i ~/.ssh/game-hive \
            deployment/gamehub-app.jar \
            ec2-user@"$EC2_HOST":/tmp/app.jar

          scp \
            -i ~/.ssh/game-hive \
            /tmp/app.env \
            ec2-user@"$EC2_HOST":/tmp/app.env

      - name: Install and start application
        run: |
          ssh \
            -i ~/.ssh/game-hive \
            ec2-user@"$EC2_HOST" \
            "
              sudo mv /tmp/app.jar /opt/gamehub/app.jar &&
              sudo mv /tmp/app.env /opt/gamehub/app.env &&
              sudo chown gamehub:gamehub /opt/gamehub/app.jar &&
              sudo chown gamehub:gamehub /opt/gamehub/app.env &&
              sudo chmod 600 /opt/gamehub/app.env &&
              sudo systemctl daemon-reload &&
              sudo systemctl enable gamehub &&
              sudo systemctl restart gamehub
            "

      - name: Check systemd service
        run: |
          ssh \
            -i ~/.ssh/game-hive \
            ec2-user@"$EC2_HOST" \
            "sudo systemctl status gamehub --no-pager"


  verify-deployment:
    name: Verify Website
    needs:
      - provision-infrastructure
      - deploy-application

    runs-on: ubuntu-latest

    env:
      EC2_HOST: ${{ needs.provision-infrastructure.outputs.ec2_host }}
      WEBSITE_URL: ${{ needs.provision-infrastructure.outputs.website_url }}

    steps:
      - name: Wait for application
        run: |
          echo "Waiting for Game Hub at $WEBSITE_URL"

          for i in {1..30}; do
            if curl --fail --silent "$WEBSITE_URL" > /dev/null; then
              echo "Game Hub is running."
              exit 0
            fi

            echo "Waiting for application..."
            sleep 5
          done

          echo "Game Hub did not respond."
          exit 1

      - name: Publish environment URL
        run: |
          echo "## Game Hub Environment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** $WEBSITE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**EC2 IP:** \`$EC2_HOST\`" >> "$GITHUB_STEP_SUMMARY"


  destroy-branch-environment:
    name: Destroy Closed Branch Environment

    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.head_ref != 'main'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ vars.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-west-2

      TF_VAR_branch_name: ${{ github.head_ref }}
      TF_VAR_ec2_ssh_public_key: ${{ vars.EC2_SSH_PUBLIC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Initialise branch Terraform state
        run: |
          echo "Destroying branch: ${{ github.head_ref }}"

          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=game-hub/${{ github.head_ref }}/terraform.tfstate"

      - name: Destroy branch infrastructure
        run: terraform destroy -auto-approve -input=false