name: Lint

on:
  push:
  pull_request:
    types:
      - closed

permissions:
  contents: read

jobs:
  terraform-lint:
    name: Terraform Lint
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: Init TFLint plugins
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TFLint
        run: tflint --recursive


  java:
    name: Java Lint & Tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Spotless check
        run: ./gradlew spotlessCheck

      - name: Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Run tests
        run: ./gradlew test


  terraform-login:
    name: Terraform AWS Login Check
    needs:
      - terraform-lint
      - java

    if: |
      github.event_name == 'push' &&
      needs.terraform-lint.result == 'success' &&
      needs.java.result == 'success'

    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ vars.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-west-2

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify AWS credentials
        run: aws sts get-caller-identity


  terraform-build:
    name: Terraform Build
    needs:
      - terraform-lint
      - java
      - terraform-login

    if: |
      github.event_name == 'push' &&
      github.ref_name != 'main' &&
      needs.terraform-lint.result == 'success' &&
      needs.java.result == 'success' &&
      needs.terraform-login.result == 'success'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ vars.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-west-2
      TF_VAR_branch_name: ${{ github.ref_name }}
      TF_VAR_ec2_ssh_public_key: ${{ vars.EC2_SSH_PUBLIC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Check deployment variables
        run: |
          if [ -z "${{ vars.TF_STATE_BUCKET }}" ]; then
            echo "TF_STATE_BUCKET is empty or has not been configured."
            exit 1
          fi

          if [ -z "${{ vars.EC2_SSH_PUBLIC_KEY }}" ]; then
            echo "EC2_SSH_PUBLIC_KEY is empty or has not been configured."
            exit 1
          fi

          if [ -z "${{ secrets.EC2_SSH_PRIVATE_KEY }}" ]; then
            echo "EC2_SSH_PRIVATE_KEY is empty or has not been configured."
            exit 1
          fi

          echo "Deployment variables are configured."

      - name: Terraform init
        run: |
          echo "Deploying branch: ${{ github.ref_name }}"

          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=game-hub/${{ github.ref_name }}/terraform.tfstate"

      - name: Migrate legacy branch infrastructure
        run: |
          LEGACY_SUBNET="game-hive-dev-db"

          if terraform state show aws_db_instance.postgres > /dev/null 2>&1; then
            CURRENT_SUBNET="$(terraform state show aws_db_instance.postgres \
              | grep 'db_subnet_group_name' \
              | head -1 \
              | cut -d '=' -f2 \
              | tr -d ' "')"

            echo "Current RDS subnet group: $CURRENT_SUBNET"

            if [ "$CURRENT_SUBNET" = "$LEGACY_SUBNET" ]; then
              echo "Legacy branch database detected."
              echo "Recreating disposable branch database with branch-specific networking..."

              terraform apply \
                -auto-approve \
                -input=false \
                -replace=aws_db_instance.postgres

              exit 0
            fi
          fi

          echo "No legacy branch infrastructure migration required."

          terraform apply \
            -auto-approve \
            -input=false
      - name: Run Flyway migrations
        run: |
          cd ..

          DB_PASSWORD="$(terraform -chdir=terraform output -raw branch_db_password)"

          echo "::add-mask::$DB_PASSWORD"

          ./gradlew flywayMigrate \
            -Pflyway.url="jdbc:postgresql://$(terraform -chdir=terraform output -raw rds_endpoint):$(terraform -chdir=terraform output -raw rds_port)/$(terraform -chdir=terraform output -raw rds_db_name)" \
            -Pflyway.user="$(terraform -chdir=terraform output -raw rds_username)" \
            -Pflyway.password="$DB_PASSWORD"

      - name: Build application
        run: |
          cd ..
          ./gradlew bootJar

      - name: Get EC2 information
        run: |
          EC2_HOST="$(terraform output -raw ec2_public_ip)"
          WEBSITE_URL="$(terraform output -raw website_url)"

          echo "EC2_HOST=$EC2_HOST" >> "$GITHUB_ENV"
          echo "WEBSITE_URL=$WEBSITE_URL" >> "$GITHUB_ENV"

          echo "EC2 IP: $EC2_HOST"
          echo "Website URL: $WEBSITE_URL"

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/game-hive

          chmod 600 ~/.ssh/game-hive

      - name: Wait for SSH
        run: |
          echo "Waiting for SSH on $EC2_HOST..."

          for i in {1..30}; do
            if ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "SSH is available."
              exit 0
            fi

            echo "Waiting for EC2 SSH..."
            sleep 10
          done

          echo "EC2 SSH did not become available."
          exit 1

      - name: Wait for EC2 setup
        run: |
          ssh \
            -i ~/.ssh/game-hive \
            -o ConnectTimeout=10 \
            ec2-user@"$EC2_HOST" \
            "sudo cloud-init status --wait"

      - name: Prepare application environment
        run: |
          DB_HOST="$(terraform output -raw rds_endpoint)"
          DB_PORT="$(terraform output -raw rds_port)"
          DB_NAME="$(terraform output -raw rds_db_name)"
          DB_USERNAME="$(terraform output -raw rds_username)"
          DB_PASSWORD="$(terraform output -raw branch_db_password)"

          echo "::add-mask::$DB_PASSWORD"

          cat > /tmp/app.env <<EOF
          DB_HOST=$DB_HOST
          DB_PORT=$DB_PORT
          DB_NAME=$DB_NAME
          DB_USERNAME=$DB_USERNAME
          DB_PASSWORD=$DB_PASSWORD
          SERVER_PORT=8080
          EOF

      - name: Find application jar
        run: |
          cd ..

          APP_JAR="$(find build/libs \
            -maxdepth 1 \
            -name '*.jar' \
            ! -name '*-plain.jar' \
            | head -1)"

          if [ -z "$APP_JAR" ]; then
            echo "No application JAR found."
            exit 1
          fi

          echo "Found application JAR: $APP_JAR"
          echo "APP_JAR=$APP_JAR" >> "$GITHUB_ENV"

      - name: Upload application
        working-directory: .
        run: |
          scp \
            -i ~/.ssh/game-hive \
            "$APP_JAR" \
            ec2-user@"$EC2_HOST":/tmp/app.jar

          scp \
            -i ~/.ssh/game-hive \
            /tmp/app.env \
            ec2-user@"$EC2_HOST":/tmp/app.env

      - name: Start application
        run: |
          ssh \
            -i ~/.ssh/game-hive \
            ec2-user@"$EC2_HOST" \
            "
              sudo mv /tmp/app.jar /opt/gamehub/app.jar &&
              sudo mv /tmp/app.env /opt/gamehub/app.env &&
              sudo chown gamehub:gamehub /opt/gamehub/app.jar &&
              sudo chown gamehub:gamehub /opt/gamehub/app.env &&
              sudo chmod 600 /opt/gamehub/app.env &&
              sudo systemctl daemon-reload &&
              sudo systemctl enable gamehub &&
              sudo systemctl restart gamehub
            "

      - name: Check application service
        run: |
          ssh \
            -i ~/.ssh/game-hive \
            ec2-user@"$EC2_HOST" \
            "sudo systemctl status gamehub --no-pager"

      - name: Check application
        run: |
          echo "Waiting for Game Hub at $WEBSITE_URL..."

          for i in {1..30}; do
            if curl --fail --silent "$WEBSITE_URL" > /dev/null; then
              echo "Game Hub is running."
              exit 0
            fi

            echo "Waiting for Game Hub..."
            sleep 5
          done

          echo "Game Hub did not respond."

          ssh \
            -i ~/.ssh/game-hive \
            ec2-user@"$EC2_HOST" \
            "sudo journalctl -u gamehub -n 100 --no-pager"

          exit 1

      - name: Publish branch URL
        run: |
          echo "## Game Hub Branch Environment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** $WEBSITE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**EC2 IP:** \`$EC2_HOST\`" >> "$GITHUB_STEP_SUMMARY"

  terraform-destroy:
    name: Terraform Destroy

    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ vars.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-west-2
      TF_VAR_branch_name: ${{ github.head_ref }}
      TF_VAR_ec2_ssh_public_key: ${{ vars.EC2_SSH_PUBLIC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Check Terraform backend variable
        run: |
          if [ -z "${{ vars.TF_STATE_BUCKET }}" ]; then
            echo "TF_STATE_BUCKET is empty or has not been configured."
            exit 1
          fi

          echo "Terraform backend is configured."

      - name: Terraform init
        run: |
          echo "Destroying environment for branch: ${{ github.head_ref }}"

          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=game-hub/${{ github.head_ref }}/terraform.tfstate"

      - name: Terraform destroy
        run: terraform destroy -auto-approve -input=false