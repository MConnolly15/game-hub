name: Lint

on:
  push:
  pull_request:
    types:
      - closed

permissions:
  contents: read

jobs:
  terraform-lint:
    name: Terraform Lint
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: Init TFLint plugins
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TFLint
        run: tflint --recursive


  java:
    name: Java Lint & Tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Spotless check
        run: ./gradlew spotlessCheck

      - name: Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Run tests
        run: ./gradlew test


  terraform-login:
    name: Terraform AWS Login Check
    needs:
      - terraform-lint
      - java

    if: |
      github.event_name == 'push' &&
      needs.terraform-lint.result == 'success' &&
      needs.java.result == 'success'

    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ vars.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-west-2

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify AWS credentials
        run: aws sts get-caller-identity


  terraform-build:
    name: Terraform Build
    needs:
      - terraform-lint
      - java
      - terraform-login

    if: |
      github.event_name == 'push' &&
      github.ref_name != 'main' &&
      needs.terraform-lint.result == 'success' &&
      needs.java.result == 'success' &&
      needs.terraform-login.result == 'success'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ vars.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-west-2
      TF_VAR_branch_name: ${{ github.ref_name }}
      TF_VAR_ec2_ssh_public_key: "unused-branch-db-only"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Check Terraform backend variables
        run: |
          if [ -z "${{ vars.TF_STATE_BUCKET }}" ]; then
            echo "TF_STATE_BUCKET is empty or has not been configured."
            exit 1
          fi

          echo "Terraform state bucket is configured."

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=game-hub/${{ github.ref_name }}/terraform.tfstate"

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false

      - name: Run Flyway migrations against the branch database
        run: |
          cd ..

          ./gradlew flywayMigrate \
            -Pflyway.url="jdbc:postgresql://$(terraform -chdir=terraform output -raw rds_endpoint):$(terraform -chdir=terraform output -raw rds_port)/$(terraform -chdir=terraform output -raw rds_db_name)" \
            -Pflyway.user="$(terraform -chdir=terraform output -raw rds_username)" \
            -Pflyway.password="$(terraform -chdir=terraform output -raw branch_db_password)"


  destroy-branch-database:
    name: Destroy Branch Database

    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ vars.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-west-2
      TF_VAR_branch_name: ${{ github.head_ref }}
      TF_VAR_ec2_ssh_public_key: "unused-branch-db-only"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Check Terraform backend variables
        run: |
          if [ -z "${{ vars.TF_STATE_BUCKET }}" ]; then
            echo "TF_STATE_BUCKET is empty or has not been configured."
            exit 1
          fi

          echo "Terraform state bucket is configured."

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=game-hub/${{ github.head_ref }}/terraform.tfstate"

      - name: Terraform destroy
        run: terraform destroy -auto-approve -input=false