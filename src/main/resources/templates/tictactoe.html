<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>TicTacToe - Game Hive</title>
  <link rel="stylesheet" href="/gamepage.css">
  <link rel="stylesheet" th:href="@{/navbar.css}">

  <meta
          name="viewport"
          content="width=device-width, initial-scale=1.0">

</head>

<body>
<nav class="navbar">
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <form th:action="@{/logout}" method="post" class="logout-form">

    <input
            type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}">

    <button type="submit" class="navbar-button">
      Logout
    </button>

  </form>

</nav>

<main>
  <div class="game_page_wrapper">
    <a href="/" class="back-link">&larr; Back to all games</a>

    <h1>Tic Tac Toe</h1>
    <p th:if="${winner != null}" th:text="${winner} + ' wins!'" class="tictactoe-game-status-over"></p>
    <p th:if="${winner == null and isDraw}" th:text="'Its a draw!'" class="tictactoe-game-status-over"></p>
    <p th:if="${winner == null and !isDraw}" th:text="'Turn: ' + ${currentPlayer}" class="tictactoe-game-status"></p>

    <div class="tictactoe_board">
      <form th:each="cell, iter : ${board}"
            th:action="@{/game/tictactoe/move}"
            method="post"
            class="tictactoe_cell_form">
        <input type="hidden" name="cellIndex" th:value="${iter.index}">
        <button type="submit"
                class="tictactoe_cell"
                th:text="${cell}"
                th:disabled="${!cell.isEmpty()} or ${winner != null}"></button>
      </form>
    </div>

    <form th:action="@{/game/tictactoe/reset}" method="post">
      <button type="submit" class="tictactoe-reset-button">Reset Game</button>
    </form>
  </div>
</main>

<footer>

  <div class="site-footer__column">
    <a href="/" class="site-footer__logo">Game Hive</a>

    <nav class="site-footer__links">
      <h3>Helpful Links</h3>
      <ul>
        <li><a href="/team">Meet the Team</a></li>
        <li><a href="/faq">FAQs</a></li>
        <li><a href="/contactus">Contact Us</a></li>
      </ul>
    </nav>
  </div>

</footer>

</body>
</html>
