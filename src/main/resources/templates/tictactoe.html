<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Tic Tac Toe - Game Hive</title>
  <link rel="stylesheet" href="/gamepage.css">
</head>
<body>

<header>
  <a href="">
    <span class="header_title">Game Hive</span>
  </a>
  <div class="site-header-user">
    <span th:text="${username}">Username</span>
  </div>
</header>

<nav class="navbar">
  <a href="/" class="navbar-button">Home</a>
</nav>

<main>
  <div class="game_page_wrapper">
    <a href="/" class="back-link">&larr; Back to all games</a>

    <h1>Tic Tac Toe</h1>
    <p th:if="${winner != null}" th:text="${winner} + ' wins!'" class="game-status"></p>
    <p th:if="${winner == null}" th:text="'Turn: ' + ${currentPlayer}" class="game-status"></p>

    <div class="tictactoe_board">
      <form th:each="cell, iter : ${board}"
            th:action="@{/game/tictactoe/move}"
            method="post"
            class="tictactoe_cell_form">
        <input type="hidden" name="cellIndex" th:value="${iter.index}">
        <button type="submit"
                class="tictactoe_cell"
                th:text="${cell}"
                th:disabled="${!cell.isEmpty()} or ${winner != null}"></button>
      </form>
    </div>

    <form th:action="@{/game/tictactoe/reset}" method="post">
      <button type="submit" class="reset-button">Reset Game</button>
    </form>
  </div>
</main>

<footer>
  <div class="site-footer__column">
    <a href="#" class="site-footer__logo">Game Hive</a>
    <nav class="site-footer__links">
      <h3>Helpful Links</h3>
      <ul>
        <li><a href="#">Meet the Team</a></li>
        <li><a href="#">FAQs</a></li>
        <li><a href="#">Contact Us</a></li>
      </ul>
    </nav>
  </div>
</footer>

</body>
</html>
