<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - GameHive</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .register-card {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        }

        .brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand h1 {
            margin: 0;
            font-size: 32px;
        }

        .brand span {
            color: #f59e0b;
        }

        h2 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #f59e0b;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #f59e0b;
            color: #111827;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #d97706;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #f59e0b;
            font-weight: bold;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
        .error-message {
            color: #dc2626;
            font-size: 14px;
            margin-top: -10px;
            margin-bottom: 12px;
        }
    </style>
</head>

<body>

<div class="register-card">

    <div class="brand">
        <h1>Game<span>Hive</span></h1>
    </div>

    <h2>Create account</h2>

    <p class="subtitle">
        Join GameHive and start playing.
    </p>

    <form method="post" th:action="@{/register}">

        <input
                type="hidden"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}">

        <label for="username">Username</label>
        <input
                id="username"
                name="username"
                type="text"
                minlength="3"
                maxlength="16"
                pattern="[A-Za-z0-9_]+"
                placeholder="Your Username"
                required>

        <p
            class="error-message"
            th:if="${usernameError}"
            th:text="${usernameError}">
        </p>

        <label for="email">Email</label>
        <input
                id="email"
                name="email"
                type="email"
                placeholder="you@example.com"
                required>
<!--        for pattern in password -the string must contain at least one letter, and at least one digit, somewhere —-->
<!--        and overall it must be 8 to 16 characters long-->

        <label for="password">Password</label>
        <input
                id="password"
                name="password"
                type="password"
                minlength="8"
                maxlength="16"
                pattern="(?=.*[A-Za-z])(?=.*\d).{8,16}"
                placeholder="Choose a password"
                required>

        <button type="submit">
            Create Account
        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a th:href="@{/login}">Log in</a>
    </div>

</div>

</body>
</html>
