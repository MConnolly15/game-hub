<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rocket Rush</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/navbar.css}">
    <link rel="stylesheet" th:href="@{/homepage.css}">
    <link rel="stylesheet" th:href="@{/rocket-rush/css/rocket-rush.css}">
</head>

<body>
<nav class="navbar">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <form th:action="@{/logout}" method="post" class="logout-form">

        <input
                type="hidden"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}">

        <button type="submit" class="navbar-button">
            Logout
        </button>

    </form>

</nav>

<main>
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div class="game-title">ROCKET RUSH</div>

        <button id="startButton">START GAME</button>
    </div>

</main>

<footer>

    <div class="site-footer__column">
        <a href="/" class="site-footer__logo">Game Hive</a>

        <nav class="site-footer__links">
            <h3>Helpful Links</h3>
            <ul>
                <li><a href="/team">Meet the Team</a></li>
                <li><a href="/faq">FAQs</a></li>
                <li><a href="/contactus">Contact Us</a></li>
            </ul>
        </nav>
    </div>

</footer>

<script type="module" th:src="@{/rocket-rush/js/rocket-rush.js}"></script>
</body>
</html>
