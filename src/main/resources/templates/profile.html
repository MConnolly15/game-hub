<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Profile page</title>
    <link rel="stylesheet" th:href="@{/navbar.css}">
    <link rel="stylesheet" href="/profile.css">
</head>
<body>

<nav class="navbar">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
</nav>

<main>
    <div class="register-card">

        <div class="brand">
            <h1>Game<span>Hive</span></h1>
        </div>

        <div id="viewMode">
            <h2><span th:text="${username}">Username</span>'s Profile</h2>

            <table style="width: 100%; margin-bottom: 20px;">
                <tr>
                    <td style="font-weight: bold; padding: 6px 0;">Username</td>
                    <td style="text-align: right;" th:text="${username}">Username</td>
                </tr>
                <tr>
                    <td style="font-weight: bold; padding: 6px 0;">Email</td>
                    <td style="text-align: right;" th:text="${email}">Email</td>
                </tr>
            </table>

            <button type="button" id="editButton">Edit profile</button>
        </div>

        <div id="editMode" style="display: none">
            <h2>Edit your profile</h2>

            <form method="post" th:action="@{/profile}">

                <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}">

                <label for="username">Username</label>
                <input
                        id="username"
                        name="username"
                        type="text"
                        minlength="3"
                        maxlength="16"
                        pattern="[A-Za-z0-9_]+"
                        th:value="${username}"
                        required>

                <p
                        class="error-message"
                        th:if="${usernameError}"
                        th:text="${usernameError}">
                </p>

                <label for="email">Email</label>
                <input
                        id="email"
                        name="email"
                        type="email"
                        th:value="${email}"
                        required>

                <label for="password">New password</label>
                <input
                        id="password"
                        name="password"
                        type="password"
                        minlength="8"
                        maxlength="16"
                        pattern="(?=.*[A-Za-z])(?=.*\d).{8,16}"
                        placeholder="Leave as-is or choose a new password"
                        required>

                <div style="display: flex; gap: 12px;">
                    <button type="submit">
                        Save
                    </button>
                    <button type="button" id="cancelButton">
                        Cancel
                    </button>
                </div>

            </form>

        </div>
    </div>
</main>

<script>
    document.getElementById('editButton').addEventListener('click', function () {
        document.getElementById('viewMode').style.display = 'none';
        document.getElementById('editMode').style.display = 'block';
    });

    document.getElementById('cancelButton').addEventListener('click', function () {
        document.getElementById('editMode').style.display = 'none';
        document.getElementById('viewMode').style.display = 'block';
    });
</script>

<footer>

    <div class="site-footer__column">
        <a href="#" class="site-footer__logo">Game Hive</a>

        <nav class="site-footer__links">
            <h3>Helpful Links</h3>
            <ul>
                <li><a href="#">About the Team</a></li>
                <li><a href="#">FAQs</a></li>
                <li><a href="#">Contact Us</a></li>
            </ul>
        </nav>
    </div>

</footer>
</body>
</html>
