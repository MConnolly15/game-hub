<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pinpoint - Game Hive</title>
    <link rel="stylesheet" href="/gamepage.css">
    <link rel="stylesheet" th:href="@{/navbar.css}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
<nav class="navbar">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <form th:action="@{/logout}" method="post" class="logout-form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit" class="navbar-button">Logout</button>
    </form>
</nav>

<main>
    <div class="game_page_wrapper">
        <a href="/" class="back-link">&larr; Back to all games</a>

        <h1>Pinpoint</h1>

        <p th:if="${message != null}" th:text="${message}" class="pinpoint-game-status-over"></p>
        <p th:if="${message == null}" th:text="'Clues revealed: ' + ${cluesRevealed} + ' | Guesses made: ' + ${guessesMade}" class="pinpoint-game-status"></p>

<!--        <ul>-->
<!--            <li th:each="clue : ${clues}" th:text="${clue}"></li>-->
<!--        </ul>-->
        <ul class="pinpoint-clue-list">
            <li th:each="clue : ${clues}" th:text="${clue}" class="pinpoint-clue"></li>
        </ul>
        <form th:if="${message == null}" th:action="@{/game/pinpoint/guess}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="text" name="guess" placeholder="Your guess">
            <button type="submit">Submit Guess</button>
        </form>

        <p th:if="${error != null}" th:text="${error}" class="pinpoint-game-status-over"></p>
        <form th:action="@{/game/pinpoint/reset}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">Reset Game</button>
        </form>

    </div>
</main>

<footer>
    <div class="site-footer__column">
        <a href="/" class="site-footer__logo">Game Hive</a>
        <nav class="site-footer__links">
            <h3>Helpful Links</h3>
            <ul>
                <li><a href="/team">Meet the Team</a></li>
                <li><a href="/faq">FAQs</a></li>
                <li><a href="/contactus">Contact Us</a></li>
            </ul>
        </nav>
    </div>
</footer>

</body>
</html>
