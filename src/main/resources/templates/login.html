<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - GameHive</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #1e293b;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-card {
            background: white;

            width: 100%;
            max-width: 420px;

            padding: 32px;

            border-radius: 16px;

            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        }

        .brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand h1 {
            margin: 0;
            font-size: 32px;
        }

        .brand span {
            color: #f59e0b;
        }

        h2 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 24px;
        }

        label {
            display: block;

            margin-bottom: 6px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 12px;

            margin-bottom: 18px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            font-size: 16px;

            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #f59e0b;
        }

        button {
            width: 100%;

            padding: 12px;

            background: #f59e0b;
            color: #111827;

            border: none;
            border-radius: 8px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #d97706;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: #f59e0b;
            font-weight: bold;
            text-decoration: none;
        }

        .message {
            padding: 10px;
            margin-bottom: 18px;

            border-radius: 8px;
            text-align: center;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

    </style>

</head>

<body>

<div class="login-card">

    <div class="brand">
        <h1>Game<span>Hive</span></h1>
    </div>

    <h2>Welcome back</h2>

    <p class="subtitle">
        Log in to continue playing.
    </p>

    <div
            class="message error"
            th:if="${param.error}">
        Incorrect email or password.
    </div>

    <div
            class="message success"
            th:if="${param.logout}">
        You have been logged out.
    </div>

    <form method="post" th:action="@{/login}">

        <input
                type="hidden"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}">

        <label for="username">
            Email
        </label>

        <input
                id="username"
                name="username"
                type="email"
                placeholder="you@example.com"
                required>

        <label for="password">
            Password
        </label>

        <input
                id="password"
                name="password"
                type="password"
                placeholder="Your password"
                required>

        <button type="submit">
            Log in
        </button>

    </form>

    <div class="register-link">

        Don't have an account?

        <a th:href="@{/register}">
            Create account
        </a>

    </div>

</div>

</body>
</html>
