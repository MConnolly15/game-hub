<!DOCTYPE html>
<!--<html xmlns:th="http://www.thymeleaf.org">-->
<!--to check if logged in:-->

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!--<head>-->
<!--    <meta charset="UTF-8">-->
<!--    <title>Navbar</title>-->
<!--</head>-->
<body>
<nav class="navbar" th:fragment="navbar">
  <button class="navbar-toggle" id="navToggle" aria-label="Toggle menu">☰</button>

  <div class="container">
    <ul class="left-side">
      <li class="navbarlogo"><a href="/" ><span class="logo"><img class="logo" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSBIjgAA0GNHh_JvdefzBWpCGdzJq8Wd3bFHfd4pZc-GA&s=10" alt="GH"></span></a></li>
    </ul>

    <ul class="right-side">
      <li sec:authorize="isAnonymous()"><a href="/login" class="navbar-button">Login</a></li>
      <li sec:authorize="isAnonymous()"><a href="/register" class="navbar-button">Register</a></li>

      <li sec:authorize="isAuthenticated()"><a href="/profile" class="navbar-button"><span th:text="${username}">Username</span></a></li>
      <li sec:authorize="isAuthenticated()">
        <form th:action="@{/logout}" method="post" class="logout-form">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <button type="submit" class="navbar-button">Logout</button>
        </form>
      </li>
    </ul>
  </div>
</nav>
<script src="/js/navbar.js" defer></script>
</body>
</html>
